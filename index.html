<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>The Artist's Code</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fonts.css">
  </head>
  <body>
    <div class="stars">
      <div class="star1"></div>
      <div class="star2"></div>
      <div class="star3"></div>
      <div class="star4"></div>
      <div class="star5"></div>
      <div class="star6"></div>
    </div>
    <div class="rain">
      <div class="droplet1"></div>
      <div class="droplet2"></div>
      <div class="droplet3"></div>
      <div class="droplet4"></div>
      <div class="droplet5"></div>
      <div class="droplet6"></div>
    </div>
    <div class="sparkle">
      <div class="obj1"></div>
      <div class="obj2"></div>
      <div class="obj3"></div>
      <div class="obj4"></div>
      <div class="obj5"></div>
      <div class="obj6"></div>
      <div class="obj7"></div>
      <div class="obj8"></div>
    </div>
    <div class="text">
        <p>Take your time.</p>
    </div>
    <div class="control">
      <p>
        (hover over the little stars to make them spin!)
        <br><br>
        <audio src="audio/light-rain.mp3" controls loop>Unavailable Rain Sounds</audio>
      </p>
    </div>
  </body>
</html>
